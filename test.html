<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>991-AudioTools Test</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    #toolbar button { padding: 0.4rem 0.8rem; cursor: pointer; }
    #toolContainer { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; border-radius: 8px; min-height: 150px; }
    .converter-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.5rem 0; }
    #status { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>🧪 991-AudioTools</h1>
  <p>Click a button below to test a tool.</p>
  <div id="toolbar">
    <button data-tool="audioConvert">🎵 Format Converter</button>
    <button data-tool="audioCompress">🗜 Compress</button>
    <button data-tool="audioCut">✂️ Cut</button>
    <button data-tool="audioJoin">🔗 Join</button>
    <button data-tool="audioMetadata">🏷️ Metadata</button>
  </div>
  <div id="toolContainer"><p style="color:#888;">Select a tool above.</p></div>

  <!-- ✅ Only Mediabunny + audiobuffer-to-wav + music-metadata -->
  <script type="importmap">
  {
    "imports": {
      "@audio/encode": "https://cdn.jsdelivr.net/npm/@audio/encode/+esm",
      "audiobuffer-to-wav": "https://cdn.jsdelivr.net/npm/audiobuffer-to-wav@1.0.0/+esm",
      "music-metadata-browser": "https://cdn.jsdelivr.net/npm/music-metadata@11.12.1/+esm",
      "browser-id3-writer": "https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/+esm"
    }
  }
  </script>

  <script type="module">
    import * as AudioTools from './src/index.js';
    console.log('✅ AudioTools loaded:', Object.keys(AudioTools));

    const container = document.getElementById('toolContainer');
    const buttons = document.querySelectorAll('[data-tool]');

    function loadTool(name) {
      container.innerHTML = `<p>⏳ Loading ${name}...</p>`;
      try {
        const fn = AudioTools[name];
        if (typeof fn !== 'function') throw new Error(`Tool "${name}" not found`);
        container.innerHTML = '';
        fn(container);
      } catch (err) {
        container.innerHTML = `<p style="color:red;">❌ Error: ${err.message}</p>`;
        console.error(err);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => loadTool(btn.dataset.tool));
    });

    loadTool('audioConvert'); // Load default tool on page load
  </script>
</body>
</html>
